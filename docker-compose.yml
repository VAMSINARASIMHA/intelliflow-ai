services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-intelliflow}
      MYSQL_USER: ${MYSQL_USER:-intelliflow_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-change_me_root}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  mysql_data:
